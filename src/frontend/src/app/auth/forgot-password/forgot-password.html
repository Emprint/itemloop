@if (sent()) {
  <div class="form-card">
    <h2>{{ 'FORGOT_PASSWORD' | translate }}</h2>
    <p class="page-loading">{{ 'RESET_LINK_SENT' | translate }}</p>
    <div class="buttons-list">
      <a class="btn-outline" routerLink="/auth/login">{{ 'BACK_TO_LOGIN' | translate }}</a>
    </div>
  </div>
} @else {
  <form class="form-card" [formGroup]="form" (ngSubmit)="submit()">
    <h2>{{ 'FORGOT_PASSWORD' | translate }}</h2>
    <p>{{ 'FORGOT_PASSWORD_HINT' | translate }}</p>
    <div class="form-field">
      <label for="email"
        ><span>{{ 'EMAIL' | translate }} <span class="req">*</span></span></label
      >
      <input type="email" formControlName="email" id="email" required autocomplete="email" />
    </div>
    @if (error()) {
      <div class="error">{{ error() }}</div>
    }
    <div class="buttons-list">
      <a class="btn-outline" routerLink="/auth/login">{{ 'CANCEL' | translate }}</a>
      <button type="submit" [disabled]="loading()">{{ 'SEND_RESET_LINK' | translate }}</button>
    </div>
  </form>
}
